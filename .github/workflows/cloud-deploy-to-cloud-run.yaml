name: Cloud Deploy to Cloud Run

on:
  push:
    branches:
      - '5-cloud-deploy-delivery-pipeline-github-actions'

jobs:
  deploy:
    permissions:
      contents: "read"
      id-token: "write"
    
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/${{ secrets.WORKLOAD_IDENTITY_PROJECT_ID }}/locations/global/workloadIdentityPools/terraform-test-pool/providers/terraform-test-provider"
          service_account: ${{ secrets.GOOGLE_CLOUD_SERVICE_ACCOUNT_EMAIL }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.PROJECT_ID }}
      
      - name: Docker Auth
        run: |-
          gcloud auth configure-docker us-central1-docker.pkg.dev
      
      - name: Buid and Push Docker Image, Container
        run: |-
          docker build -t us-central1-docker.pkg.dev/${{ secrets.PROJECT_ID }}/terraform-test-repo/oshin-test-telemetry:${{ github.sha }} .
          docker push us-central1-docker.pkg.dev/${{ secrets.PROJECT_ID }}/terraform-test-repo/oshin-test-telemetry:${{ github.sha }}
      
      - name: Render Templatised Config Manifests
        run: |-
          export PROJECT_ID="${{ secrets.PROJECT_ID }}"
          export REGION="${{ vars.REGION }}"
          export APP="oshin-test-telemetry"
          export SHA="${{ github.sha }}"
          export SERVICE_ACCOUNT="${{ secrets.GOOGLE_CLOUD_SERVICE_ACCOUNT_EMAIL }}"
          for template in $(ls cloud-deploy/*.template.yaml); do envsubst < ${template} > ${template%%.*}.yaml ; done
      
      - name: Create Cloud Deploy delivery pipeline
        run: |-
          gcloud deploy apply --file=cloud-deploy/cloud-deploy.yaml --region=${{ vars.REGION }}
      
      - name: Create Release Name
        run: |-
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7 | tr '[:upper:]' '[:lower:]')
          echo "RELEASE_NAME=release-${SHORT_SHA}-${GITHUB_RUN_NUMBER}" >> ${GITHUB_ENV}
      
      - name: Create Cloud Deploy release
        id: release
        uses: google-github-actions/create-cloud-deploy-release@v0
        with:
          delivery_pipeline: "oshin-test-telemetry"
          name: ${{ env.RELEASE_NAME }}
          region: ${{ vars.REGION }}
          description: "Release for ${{ github.sha }}"
          skaffold_file: "skaffold.yaml"
          images: "app=us-central1-docker.pkg.dev/${{ secrets.PROJECT_ID }}/terraform-test-repo/oshin-test-telemetry:${{ github.sha }}"
          source: "cloud-deploy"
      
      - name: Report Cloud Deploy Release
        run: |-
          echo "Create release ${{ steps.release.outputs.name }}"
          echo "Release link ${{ steps.release.outputs.link }}"
